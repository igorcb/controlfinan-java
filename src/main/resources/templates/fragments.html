<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="errors(errors)" th:if="${errors != null and !errors.isEmpty()}" class="rounded-md bg-red-50 px-4 py-3 text-sm text-red-800">
  <ul class="list-inside list-disc">
    <li th:each="message : ${errors}" th:text="${message}"></li>
  </ul>
</div>

<form th:fragment="form" class="card space-y-4" th:action="${entry.persisted} ? @{/current_accounts/{id}(id=${entry.id})} : '/current_accounts'" accept-charset="UTF-8" method="post"><input th:if="${entry.persisted}" type="hidden" name="_method" value="patch" autocomplete="off"><input type="hidden" name="authenticity_token" th:value="${csrf}" autocomplete="off">
  <div th:replace="~{fragments :: errors(${errors})}"></div>

  <div class="grid grid-cols-2 gap-2" role="radiogroup" aria-label="Tipo">
    <label class="flex cursor-pointer items-center justify-center rounded-md border border-slate-300 py-3 font-medium text-slate-600 has-checked:border-red-600 has-checked:bg-red-600 has-checked:text-white">
      <input class="sr-only" type="radio" value="debito" th:checked="${entry.typeLaunche == -1}" name="current_account[type_launche]" id="current_account_type_launche_debito"> Débito
    </label>
    <label class="flex cursor-pointer items-center justify-center rounded-md border border-slate-300 py-3 font-medium text-slate-600 has-checked:border-emerald-600 has-checked:bg-emerald-600 has-checked:text-white">
      <input class="sr-only" type="radio" value="credito" th:checked="${entry.typeLaunche == 1}" name="current_account[type_launche]" id="current_account_type_launche_credito"> Crédito
    </label>
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <div>
      <label class="label" for="current_account_price">Valor</label>
      <input step="0.01" min="0.01" placeholder="0,00" inputmode="decimal" th:autofocus="${!entry.persisted}" class="input text-lg font-semibold" type="number" th:value="${entry.priceField()}" name="current_account[price]" id="current_account_price">
    </div>

    <div>
      <label class="label" for="current_account_date_ocurrence">Data</label>
      <input class="input" type="date" th:value="${entry.dateOcurrence}" name="current_account[date_ocurrence]" id="current_account_date_ocurrence">
    </div>

    <div>
      <label class="label" for="current_account_cost_id">Categoria</label>
      <select class="input" name="current_account[cost_id]" id="current_account_cost_id"><option th:if="${entry.costId == null}" value="">Selecione</option>
        <option th:each="option : ${costs}" th:selected="${option.id == entry.costId}" th:value="${option.id}" th:text="${option.name}"></option>
      </select>
    </div>

    <div>
      <label class="label" for="current_account_cash_account_id">Conta</label>
      <select class="input" name="current_account[cash_account_id]" id="current_account_cash_account_id"><option th:if="${entry.cashAccountId == null}" value="">Selecione</option>
        <option th:each="option : ${cashAccounts}" th:selected="${option.id == entry.cashAccountId}" th:value="${option.id}" th:text="${option.name}"></option>
      </select>
    </div>

    <div class="sm:col-span-2">
      <label class="label" for="current_account_historic">Histórico</label>
      <input class="input" type="text" th:value="${entry.historic}" name="current_account[historic]" id="current_account_historic">
    </div>
  </div>

  <div class="flex flex-col-reverse gap-3 sm:flex-row">
    <a class="btn-secondary py-3 sm:py-2" th:href="${entry.persisted} ? @{/current_accounts/{id}(id=${entry.id})} : '/current_accounts'">Cancelar</a>
    <input type="submit" value="Salvar" class="btn-primary py-3 sm:order-first sm:py-2">
  </div>
</form>

<table th:fragment="amounts(table)" class="min-w-full divide-y divide-slate-200 text-sm">
  <thead class="text-left text-xs font-medium uppercase tracking-wide text-slate-500">
    <tr>
      <th class="px-2 py-2 sm:px-4" th:text="${table.header}"></th>
      <th class="px-2 py-2 sm:px-4 text-right">Valor</th>
    </tr>
  </thead>
  <tbody class="divide-y divide-slate-100">
    <tr th:each="row : ${table.rows}">
      <td class="px-2 py-2 sm:px-4" th:text="${row.label}"></td>
      <td th:class="'px-2 py-2 sm:px-4 text-right ' + ${F.amountClass(row.amount)}" th:text="${F.currency(row.amount)}"></td>
    </tr>
    <tr th:if="${table.rows.isEmpty()}"><td colspan="2" class="px-4 py-4 text-center text-slate-500">Nenhum lançamento no período.</td></tr>
  </tbody>
  <tfoot>
    <tr class="border-t-2 border-slate-200 font-semibold">
      <td class="px-2 py-2 sm:px-4" th:text="${table.totalLabel}"></td>
      <td th:class="'px-2 py-2 sm:px-4 text-right ' + ${F.amountClass(table.total)}" th:text="${F.currency(table.total)}"></td>
    </tr>
  </tfoot>
</table>

</body>
</html>
