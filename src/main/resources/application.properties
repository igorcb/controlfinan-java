spring.application.name=controlfinan
server.port=${PORT:8000}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/controlfinan_java}
spring.datasource.username=${DATABASE_USERNAME:app}
spring.datasource.password=${DATABASE_PASSWORD:app}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:10}
# Same tables as the Rails app, created when missing (CREATE TABLE IF NOT EXISTS).
spring.sql.init.mode=always
# PATCH, PUT and DELETE come from the "_method" form field, like Rails.
spring.mvc.hiddenmethod.filter.enabled=true
spring.web.resources.cache.period=0
server.servlet.session.persistent=false
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.jackson.default-property-inclusion=always
controlfinan.secret=${SECRET_KEY_BASE:}
controlfinan.bcrypt-cost=${BCRYPT_COST:12}
controlfinan.time-zone=${APP_TIMEZONE:America/Sao_Paulo}
logging.level.root=${LOG_LEVEL:info}
