services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: controlfinan_java
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/controlfinan_java
      TEST_DATABASE_URL: jdbc:postgresql://db:5432/controlfinan_java_test
      SECRET_KEY_BASE: development-only-secret
      BCRYPT_COST: 12
      THYMELEAF_CACHE: "false"
    ports:
      - "8004:8000"
    volumes:
      - .:/app
      - m2:/home/app/.m2
    depends_on:
      - db

volumes:
  db_data:
  m2:
